name: Build and Publish Wheels

# Triggered by pushing a `v*` tag (e.g. v0.1.0) or by publishing a GitHub
# Release.  `workflow_dispatch` builds only -- it never publishes, so it is safe
# to run by hand to check that the wheel still builds.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------- Source distribution ----------------
  # When no prebuilt wheel exists for a platform/Python version, pip falls back
  # to this and builds from source (needs a Rust toolchain on the target machine).
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      # `subprojects/` are git submodules; meson hard-errors without them.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      # Named `wheels-*` so the publish job's `pattern: wheels-*` picks it up.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  # ---------------- Binary wheels ----------------
  wheels:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 (Intel) is retired upstream; macos-latest is arm64.
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Needed by the still-unported C/Cython extensions; see ci.yml.
      - name: Install BLAS/LAPACK and pkg-config (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install BLAS/LAPACK and pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas pkg-config

      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          ./build_wheel.sh --out-dir dist --python python

      # PyPI rejects `linux_x86_64`; auditwheel retags it as manylinux.
      # macOS/Windows wheels need no repair.
      - name: Repair wheel (Linux only)
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel
          python -m auditwheel repair dist/*.whl --wheel-dir wheelhouse

      - name: Collect wheel
        shell: bash
        run: |
          mkdir -p dist-final
          if [ -d wheelhouse ]; then
            cp wheelhouse/*.whl dist-final/
          else
            cp dist/*.whl dist-final/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist-final/*.whl

  # ---------------- Publish to PyPI (tags / Release only) ----------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: PyO3/maturin-action@v1
        env:
          # Settings → Secrets and variables → Actions. Value is a PyPI token
          # (starts with `pypi-`).
          MATURIN_PYPI_TOKEN: ${{ secrets.YJ_NIU }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
