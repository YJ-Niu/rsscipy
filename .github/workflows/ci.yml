name: CI

on:
  push:
    branches: [main, master, dev, main-dev]
  pull_request:
    branches: [main, master, dev, main-dev]

# A new push to the same branch/PR cancels the still-running older job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # `requires-python = ">=3.12"` in pyproject.toml is the floor here.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # `subprojects/` (array_api_compat, xsf, unuran, ...) are git submodules
      # and meson hard-errors when they are missing.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust kernels
        run: cargo test --workspace
        working-directory: rust

      # The still-unported C/Cython extensions link BLAS/LAPACK, and meson
      # locates them via pkg-config.  Neither is present on a bare runner.
      # (The ported BLAS/LAPACK kernels are Rust and need none of this.)
      - name: Install BLAS/LAPACK and pkg-config (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install BLAS/LAPACK and pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas pkg-config

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Build the wheel
        run: ./build_wheel.sh --out-dir dist

      - name: Install built wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Smoke test
        run: |
          python -c "import rsscipy; print('rsscipy', rsscipy.__version__)"
          python -m pytest -q

  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
