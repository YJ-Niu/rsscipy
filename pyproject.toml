[build-system]
# The build is driven by the in-tree ``rsbuild`` PEP 517 backend (see
# ``tools/rsbuild.py``), located via ``backend-path``. It builds the unified
# Rust extension (``tools/build_rust.py``) and packages ``python/`` into a
# wheel. The backend is stdlib-only, so no build-time packages are required and
# a wheel can be built fully offline -- the only external tool is ``cargo``.
build-backend = "rsbuild"
backend-path = ["tools"]
requires = []

[project]
# The distribution is `rsscipy`; the *import* package stays `scipy` so this
# remains a drop-in replacement -- `pip install rsscipy`, then `import scipy`.
name = "rsscipy"
version = "0.1.1"
license = { file = "LICENSE.txt" }
description = "Fundamental algorithms for scientific computing in Python, built on rsnumpy"
authors = [
    { name = "YJ-Niu" },
]
maintainers = [
    { name = "rsSciPy Developers" },
]
keywords = [
    "scientific",
    "computing",
    "linear-algebra",
    "rsnumpy",
    "rust",
]
requires-python = ">=3.12"
dependencies = [
    "rsnumpy>=1.2.5",
]
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.urls]
homepage = "https://github.com/YJ-Niu/rsscipy"
documentation = "https://github.com/YJ-Niu/rsscipy#readme"
source = "https://github.com/YJ-Niu/rsscipy"
download = "https://pypi.org/project/rsscipy/"
tracker = "https://github.com/YJ-Niu/rsscipy/issues"

# NOTE: when updating this table, also update `dependency-groups.optional-runtime-deps`
[project.optional-dependencies]
all = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "rsplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

[dependency-groups]
optional-runtime-deps = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "rsplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

test-core = [
    "pytest>=9.1.1",
    "hypothesis>=6.30",
    "pooch",
    "pytest-xdist",  # not required, but used widely, belongs in -core
    "pytest-timeout",  # not required, but used widely, belongs in -core
]
test-mp = [
    "mpmath",
    # for PyPI: 'gmpy2; sys_platform != "win32" or platform_machine != "ARM64"'
    "gmpy2",
]
test-parallel = [
    { include-group = "test-core" },
    "pytest-run-parallel",
]
test-docs = [
    { include-group = "test-core" },
    "scipy-doctest>=2.0.0",
    "matplotlib",
]
test-array-types = [
    { include-group = "test-core" },
    "array-api-strict>=2.3.1",
    "marray",
    # for PyPI: 'sparse; sys_platform != "win32" or platform_machine != "ARM64"'
    "sparse",
]
test = [
    { include-group = "optional-runtime-deps" },
    { include-group = "test-core" },
    { include-group = "test-mp" },
    { include-group = "test-parallel" },
    { include-group = "test-docs" },
    { include-group = "test-array-types" },
    # useful but doesn't have its own group (rarely used, and has compiled wheels so can be hard to install)
    "psutil",
]
test-fail-slow = [
    { include-group = "test-core" },
    "pytest-fail-slow",  # only one CI job; isolated so it doesn't cause failures for contributors randomly
]
coverage = [
    { include-group = "test" },  # includes all optional test and runtime deps for maximum coverage
    "pytest-cov",
]
dev = [
    { include-group = "test" },
    "scipy-stubs",
]
