[build-system]
build-backend = 'mesonpy'
# NOTE: when updating this table, also update `dependency-groups.build`
#
# These are installed into an isolated build env, so *everything* meson needs at
# configure time has to be listed.  `meson-python` is the backend itself, and
# `rsnumpy` is imported by `scipy/` at build/install time -- omitting either
# makes `pip install .` fail in a way that looks unrelated to packaging.
#
# `numpy` here is a *build-time* dependency only: the still-unported C/Cython
# extensions link against NumPy's C API (`np_dep` in the meson files).  At run
# time the package uses `rsnumpy` exclusively -- see `[project].dependencies`,
# which lists nothing else.  It can be dropped once the port is complete.
requires = [
    "meson-python>=0.15.0",
    "ninja>=1.8.2",
    "Cython>=3.2.0",
    "pybind11>=2.13.2",
    "pythran>=0.18.1",
    "numpy>=2.0.0",
    "rsnumpy>=1.2.4",
]

[project]
# The distribution is `rsscipy`; the *import* package stays `scipy` so this
# remains a drop-in replacement -- `pip install rsscipy`, then `import scipy`.
name = "rsscipy"
version = "0.1.0"
# TODO: add `license-files` once PEP 639 is accepted (see meson-python#88)
#       at that point, no longer include them in `py3.install_sources()`
license = { file = "LICENSE.txt" }
description = "Fundamental algorithms for scientific computing in Python, built on rsnumpy"
authors = [
    { name = "YJ-Niu" },
]
maintainers = [
    { name = "rsSciPy Developers" },
]
keywords = [
    "scientific",
    "computing",
    "linear-algebra",
    "rsnumpy",
    "rust",
]
# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
requires-python = ">=3.12"  # keep in sync with `min_python_version` in meson.build
dependencies = [
    "rsnumpy>=1.2.4",
] # keep in sync with `min_numpy_version` in meson.build
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.urls]
homepage = "https://github.com/YJ-Niu/rsscipy"
documentation = "https://github.com/YJ-Niu/rsscipy#readme"
source = "https://github.com/YJ-Niu/rsscipy"
download = "https://pypi.org/project/rsscipy/"
tracker = "https://github.com/YJ-Niu/rsscipy/issues"

# NOTE: when updating this table, also update `dependency-groups.optional-runtime-deps`
[project.optional-dependencies]
all = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "matplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

[dependency-groups]
optional-runtime-deps = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "matplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

build = [
    "meson-python>=0.15.0",
    "Cython>=3.2.0",
    "pybind11>=2.13.2",
    "pythran>=0.18.1",
    "numpy>=2.0.0",
    "ninja>=1.8.2",
]

test-core = [
    "pytest>=8.0.0",
    "hypothesis>=6.30",
    "pooch",
    "pytest-xdist",  # not required, but used widely, belongs in -core
    "pytest-timeout",  # not required, but used widely, belongs in -core
]
test-mp = [
    "mpmath",
    # for PyPI: 'gmpy2; sys_platform != "win32" or platform_machine != "ARM64"'
    "gmpy2",
]
test-extending-cython = [  # {special, linalg, optimize}.tests.test_extending
    "Cython",
    "meson",
    'ninja; sys_platform != "emscripten"',
]
test-parallel = [
    { include-group = "test-core" },
    "pytest-run-parallel",
]
test-docs = [
    { include-group = "test-core" },
    "scipy-doctest>=2.0.0",
    "matplotlib",
]
test-array-types = [
    { include-group = "test-core" },
    "array-api-strict>=2.3.1",
    "marray",
    # for PyPI: 'sparse; sys_platform != "win32" or platform_machine != "ARM64"'
    "sparse",
]
test = [
    { include-group = "optional-runtime-deps" },
    { include-group = "test-core" },
    { include-group = "test-mp" },
    { include-group = "test-extending-cython" },
    { include-group = "test-parallel" },
    { include-group = "test-docs" },
    { include-group = "test-array-types" },
    # useful but doesn't have its own group (rarely used, and has compiled wheels so can be hard to install)
    "psutil",
]
test-fail-slow = [
    { include-group = "test-core" },
    "pytest-fail-slow",  # only one CI job; isolated so it doesn't cause failures for contributors randomly
]
coverage = [
    { include-group = "test" },  # includes all optional test and runtime deps for maximum coverage
    "pytest-cov",
]
openblas32 = [
    "scipy-openblas32==0.3.34.237.2",
    'pkgconf==2.5.1.post1; sys_platform == "win32"',
]
openblas64 = [
    "scipy-openblas64==0.3.34.237.0",
    'pkgconf==2.5.1.post1; sys_platform == "win32"',
]





dev = [
    { include-group = "build" },
    { include-group = "test" },
    "scipy-stubs",

]

[tool.meson-python.args]
install = ['--skip-subprojects']
