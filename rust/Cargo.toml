# Rust extension layer for rsscipy.
#
# All native Rust kernels are built into one CPython extension. The source
# modules remain separated by domain under `rsscipy_rs/src`.
[workspace]
resolver = "2"
members = ["rsscipy_rs"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "BSD-3-Clause"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["macros"] }
