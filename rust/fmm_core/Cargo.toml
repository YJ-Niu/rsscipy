# Rust replacement for the Matrix Market I/O C++ extension (`_fmm_core`).
#
# Produces the CPython extension `python/rsscipy/io/_fast_matrix_market/_fmm_core.so`,
# which backs `rsscipy.io.mmread` / `mmwrite` / `mminfo`.
[package]
name = "fmm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Matrix Market (.mtx) I/O kernels for rsSciPy"

[lib]
name = "_fmm_core"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
