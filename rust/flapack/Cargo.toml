[package]
name = "rsscipy-flapack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of the `scipy/linalg/src/lapack` extension (`_flapack`)"

[lib]
# becomes `scipy/linalg/_flapack_rs.so`; `scipy/linalg/_flapack.py` wraps it
# with the argument conversion that `lapack_helpers.hpp` used to do.
name = "_flapack_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3.workspace = true
