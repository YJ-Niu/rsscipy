[package]
name = "rsscipy-fblas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of the `scipy/linalg/src/blas` extension (`_fblas`)"

[lib]
# becomes `scipy/linalg/_fblas_rs.so`; `scipy/linalg/_fblas.py` wraps it with
# the argument conversion that `blas_helpers.hpp` used to do.
name = "_fblas_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3.workspace = true
