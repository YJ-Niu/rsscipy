# Which Rust crate produces which CPython extension module, and where it goes.
#
#   crate  : directory name under `rust/`
#   lib    : the `#[pymodule]` name == the `[lib] name` in the crate's Cargo.toml
#   dest   : destination directory inside the Python package
#
# Add a new entry (plus the crate) whenever another C/Cython module is ported.
[[module]]
crate = "fpumode"
lib = "_fpumode"
dest = "python/rsscipy/_lib"

[[module]]
crate = "ccallback"
lib = "_ccallback_rs"
dest = "python/rsscipy/_lib"

[[module]]
crate = "array_utils"
lib = "_array_utils_rs"
dest = "python/rsscipy/linalg"

[[module]]
crate = "fblas"
lib = "_fblas_rs"
dest = "python/rsscipy/linalg"

[[module]]
crate = "flapack"
lib = "_flapack_rs"
dest = "python/rsscipy/linalg"

[[module]]
crate = "peak_finding_utils"
lib = "_peak_finding_utils_rs"
dest = "python/rsscipy/signal"
