project-includes = ["scicore"]
project-excludes = ["scicore/*/tests/**"]

ignore-missing-imports = [
    # pyrefly can't find these on some machines
    "scicore.__config__",
    "scicore.version",
    # vendoring
    "scicore._external.*",
    # deps with no types
    "pytest_run_parallel",
    "scicore_doctest.*",
    "sksparse.*",
    # missing deps
    "cupyx.*",
    "scikits.umfpack",
    # implicit relative imports
    "_wrappers_common",
    "convert",
    "tempita",
    # extension modules with no stubs
    "scicore._scicore_rs",
    "scicore._lib._uarray._uarray",
    "scicore.fft._duccfft.pyduccfft",
    "scicore.integrate._dop",
    "scicore.integrate._odepack",
    "scicore.integrate._quadpack",
    "scicore.integrate._vode",
    "scicore.interpolate._dierckx",
    "scicore.interpolate._fitpack",
    "scicore.linalg._batched_linalg",
    "scicore.linalg._decomp_update",
    "scicore.linalg._fblas",
    "scicore.linalg._fblas_64",
    "scicore.linalg._flapack",
    "scicore.linalg._flapack_64",
    "scicore.linalg._internal_matfuncs",
    "scicore.optimize._highspy._core",
    "scicore.optimize._lbfgsb",
    "scicore.optimize._lsap",
    "scicore.optimize._minpack",
    "scicore.optimize._moduleTNC",
    "scicore.optimize._pava_pybind",
    "scicore.optimize._slsqplib",
    "scicore.optimize._zeros",
    "scicore.ndimage._nd_image",
    "scicore.ndimage._ni_label",
    "scicore.ndimage._rank_filter_1d",
    "scicore.signal._sigtools",
    "scicore.sparse._sparsetools",
    "scicore.sparse.linalg._dsolve._superlu",
    "scicore.sparse.linalg._eigen.arpack._arpacklib",
    "scicore.spatial.distance._distance_pybind",
    "scicore.spatial.distance._distance_wrap",
    "scicore.spatial.cKDTree", # TODO(lucascolley): figure out why this is needed, I can't reproduce locally
    "scicore.special._gufuncs",
    "scicore.special._special_ufuncs",
]
replace-imports-with-any = [
    # missing attributes from modules
    "scicore.linalg.blas.dtrsm",
    "scicore.sparse.linalg._propack.*",
]

check-unannotated-defs = false
errors = { "redundant-cast" = "error" }

# there are currently 960 `bad-override` errors in `scicore/stats/**`, most of which
# are caused by violations of Liskov's substitution principle in the distributions
[[sub-config]]
matches = "scicore/stats/**/*.py"
errors = { "bad-override" = "ignore" }
